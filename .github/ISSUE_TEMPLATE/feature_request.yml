name: Feature request
description: Suggest an improvement or a new capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or use case, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Faucet to do?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - REST API
        - MCP server / AI agents
        - Admin UI
        - CLI
        - Roles / API keys
        - Database support
        - Docs
        - Other
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds you have tried
